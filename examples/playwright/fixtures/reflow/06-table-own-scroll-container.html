<!DOCTYPE html>
<!--
  Fixture: a data table in its own scrollable container.
  Expected reflow-risk verdict: no-overflow-detected (page-level)
  Rationale: the table requires a two-dimensional layout for meaning
  (rows and columns) and is wrapped in a container with its own
  overflow-x: auto, so the *page* does not scroll horizontally even though
  the table's own container does. Manual review should confirm the table
  itself qualifies for the SC 1.4.10 exception and that surrounding
  content (heading, caption) is not also forced to scroll.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflow fixture: table in its own scroll container</title>
<style>
  body { margin: 0; font-family: sans-serif; padding: 1rem; }
  .table-scroll { overflow-x: auto; max-width: 100%; }
  table { border-collapse: collapse; min-width: 700px; }
  th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
</style>
</head>
<body>
  <h1>Quarterly results</h1>
  <p>This paragraph is outside the scroll container and must remain
  fully readable without horizontal scrolling.</p>
  <div class="table-scroll">
    <table>
      <caption>Revenue by region and quarter</caption>
      <thead>
        <tr><th>Region</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Total</th></tr>
      </thead>
      <tbody>
        <tr><td>North</td><td>120</td><td>130</td><td>110</td><td>140</td><td>500</td></tr>
        <tr><td>South</td><td>90</td><td>95</td><td>100</td><td>105</td><td>390</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
