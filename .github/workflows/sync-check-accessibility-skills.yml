name: Check sync with accessibility-skills

on:
  schedule:
    # Run weekly on Monday at 08:17 UTC.
    # Avoid :00 because GitHub scheduled workflows are often delayed there.
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-check-accessibility-skills
  cancel-in-progress: true

jobs:
  check-sync:
    name: Run the canonical sync engine against this checkout
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out ACCESSIBILITY.md
        uses: actions/checkout@v5
        with:
          path: ACCESSIBILITY.md
          fetch-depth: 0

      - name: Check out accessibility-skills
        uses: actions/checkout@v5
        with:
          repository: mgifford/accessibility-skills
          path: accessibility-skills
          fetch-depth: 0

      - name: Run the shared sync engine
        id: sync_check
        working-directory: accessibility-skills
        env:
          ACCESSIBILITY_MD_DIR: ${{ github.workspace }}/ACCESSIBILITY.md
        run: |
          set +e
          {
            ./scripts/sync-check.sh
            skill_code=$?
            echo ""
            ./scripts/sync-check.sh --vocab
            vocab_code=$?
          } > /tmp/sync-report.txt 2>&1
          set -e
          cat /tmp/sync-report.txt
          {
            echo "skill_exit_code=$skill_code"
            echo "vocab_exit_code=$vocab_code"
          } >> "$GITHUB_OUTPUT"
          if [ "$skill_code" -ne 0 ] || [ "$vocab_code" -ne 0 ]; then
            echo "has_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate machine-readable report
        if: always()
        working-directory: accessibility-skills
        env:
          ACCESSIBILITY_MD_DIR: ${{ github.workspace }}/ACCESSIBILITY.md
        run: |
          node scripts/sync.mjs report --format json --output /tmp/sync-report.json || true

      - name: Upload synchronization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-md-sync-report
          path: /tmp/sync-report.json
          if-no-files-found: ignore

      - name: Publish the report
        if: always()
        run: |
          {
            echo "## Cross-repository sync report"
            echo ""
            echo '```'
            cat /tmp/sync-report.txt 2>/dev/null || echo "No report was produced."
            echo '```'
            echo ""
            echo "The actionable issue is owned by the skills repository:"
            echo "<https://github.com/mgifford/accessibility-skills/issues?q=is%3Aissue+is%3Aopen+label%3Askill-sync-drift>"
            echo ""
            echo "This workflow does not create a second issue for the same finding."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when review is required
        if: steps.sync_check.outputs.has_review == 'true'
        run: |
          echo "Sync review is required. See the report above and the issue in mgifford/accessibility-skills."
          exit 1
